[build]
  # `|| true` on the IndexNow step: it's a nice-to-have ping, not a deploy gate. It no-ops safely
  # until a real IndexNow key is set in src/_data/site.json (see OWNER_TODO.md).
  command = "npm run build && (node scripts/indexnow-submit.mjs || true)"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# ---- Security headers ----
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://www.clarity.ms https://*.clarity.ms https://region1.google-analytics.com; frame-src https://www.google.com; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # NOT immutable/long-lived here: main.css, main.js and the other hand-written files under
    # /assets/ keep the same URL forever even when their content changes on a new deploy, so a
    # year-long "immutable" cache (the previous setting) silently hid every CSS/JS fix from
    # anyone who'd already loaded the site — no amount of hard-refreshing would show the update
    # until the cache naturally expired. Only genuinely content-hashed paths (below) get long
    # caching, since their URL itself changes whenever the content does.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---- Legacy URL redirects (301) ----
